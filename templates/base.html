<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block description %}Upcoming heritage rail tours across Victoria.{% endblock %}">
  <title>{% block title %}Heritage Rail Tours{% endblock %}</title>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Heritage Rail Tours">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.description() }}">
  <meta property="og:url" content="{{ request.url }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="alternate" type="application/rss+xml" title="Heritage Rail Tours RSS Feed" href="{{ url_for('rss_feed') }}">
</head>
<body>
  {% set current = request.endpoint %}
  <nav class="navbar">
    <ul>
      <li><a class="navbar-logo" href="https://victorianrailphotos.com" aria-label="Victorian Rail Photos"><img src="{{ url_for('static', filename='images/logo_small.png') }}" class="logo" alt="Victorian Rail Photos"></a></li>
      <li><a href="{{ url_for('tours') }}"{% if current == 'tours' %} aria-current="page"{% endif %}><i class="fa-solid fa-route" aria-hidden="true"></i> Upcoming Tours</a></li>
      <li><a href="{{ url_for('tour_archive') }}"{% if current == 'tour_archive' %} aria-current="page"{% endif %}><i class="fa-solid fa-box-archive" aria-hidden="true"></i> Tour Archive</a></li>
      <li><a href="{{ url_for('rss_feed') }}"><i class="fa-solid fa-rss" aria-hidden="true"></i> RSS Feed</a></li>
      <li><a href="{{ url_for('ical_feed') }}"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> iCal Feed</a></li>
      <li><a href="https://victorianrailphotos.com"><i class="fa-solid fa-camera" aria-hidden="true"></i> Victorian Rail Photos</a></li>
    </ul>
  </nav>
  <div class="page-header">
    <h1>{% block heading %}{% endblock %}</h1>
  </div>
  {% block content %}{% endblock %}
  <div class="footer">
    <p>Data from <a href="https://www.steamrail.com.au/tours" target="_blank" rel="noopener noreferrer">Steamrail Victoria</a>, <a href="https://www.slowrailjourneys.com.au/upcoming-journeys" target="_blank" rel="noopener noreferrer">Slow Rail Journeys</a>, <a href="https://www.707operations.com/day" target="_blank" rel="noopener noreferrer">707 Operations</a>, and <a href="https://srhc.org.au/tours/" target="_blank" rel="noopener noreferrer">Seymour Railway Heritage Centre</a>.</p>
  </div>
</body>
</html>
